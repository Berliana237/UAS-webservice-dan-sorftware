openapi: 3.0.3
info:
  title: Rangkai API
  version: 1.1.0
  description: |
    REST API reservasi kereta antarkota dengan seat locking per segmen. Semua klien masuk lewat API Gateway.

    **Autentikasi**
    - Pengguna: OAuth2 Authorization Code + PKCE, menghasilkan JWT RS256 berumur 15 menit.
    - Antar service dan partner: OAuth2 Client Credentials.
    - Partner: API key lewat header `X-API-Key`.

    **Peran.** `customer` (memesan), `masinis` (jadwal dinas, manifest, check-in, lapor terlambat), `admin` (data operasional, pengguna, verifikasi transfer, sistem).

    **Idempotency.** `POST /api/locks`, `POST /api/bookings`, dan `POST /api/payments` wajib membawa header `Idempotency-Key`.

    **Format error** seragam: `{ "error": { "code", "message", "details" }, "requestId" }`.

    **Mencoba di halaman ini.** Klik **Authorize**, centang scope yang dibutuhkan, pilih `authorizationCode`, isi `client_id` = `rangkai-postman` (tanpa secret, PKCE aktif), lalu masuk dengan akun demo. Endpoint publik bisa langsung dicoba lewat **Try it out**.

    Dibangun oleh Kelompok A (Web Service x Software Testing).

    Protokol non-REST (GraphQL) didokumentasikan di `docs/schema.graphql` dan `docs/graphql-examples.md`.
servers:
  - url: /
    description: Server yang sedang membuka dokumen ini
  - url: https://rangkai-production.up.railway.app
    description: Deployment Railway (code freeze minggu 12)
  - url: http://localhost:8080
    description: Lokal lewat run.bat
  - url: https://localhost:8443
    description: Lokal lewat TLS (sertifikat dev)
tags:
  - { name: OAuth2, description: Authorization Server }
  - { name: Jadwal, description: Stasiun dan perjalanan }
  - { name: Kursi, description: Seat locking per segmen }
  - { name: Pesanan, description: Siklus hidup pesanan }
  - { name: Pembayaran, description: Pembayaran lewat webhook bertanda tangan }
  - { name: Notifikasi, description: Notifikasi pengguna }
  - { name: Masinis, description: Jadwal dinas, manifest, check-in, laporan keterlambatan }
  - { name: Profil, description: Data diri pengguna }
  - { name: Bantuan, description: FAQ dan chat AI Pusat Bantuan }
  - { name: Data Operasional, description: Stasiun, kereta, rute, tarif, jam operasional, diskon lansia (admin) }
  - { name: Partner, description: Akses partner dengan API key }
  - { name: Admin, description: API key, pengguna, audit, sistem }
security: []
paths:
  /.well-known/openid-configuration:
    get:
      tags: [OAuth2]
      summary: Metadata Authorization Server
      responses:
        '200': { description: Metadata OAuth2, content: { application/json: { schema: { type: object } } } }
  /.well-known/jwks.json:
    get:
      tags: [OAuth2]
      summary: Kunci publik untuk verifikasi JWT
      responses:
        '200': { description: JWKS, content: { application/json: { schema: { type: object } } } }
  /api/auth/register:
    post:
      tags: [OAuth2]
      summary: Mendaftarkan pelanggan baru
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Terdaftar }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /oauth/authorize:
    get:
      tags: [OAuth2]
      summary: Memulai Authorization Code + PKCE
      description: Dengan `Accept application/json` mengembalikan `auth_request`. Tanpa itu, mengalihkan (302) ke halaman masuk.
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string, example: rangkai-postman } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: state, in: query, required: true, schema: { type: string, minLength: 8 } }
        - { name: scope, in: query, schema: { type: string } }
      responses:
        '422': { description: Validasi gagal (body/query tidak sesuai), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: auth_request dibuat }
        '302': { description: Dialihkan ke halaman masuk }
        '400': { $ref: '#/components/responses/Error' }
  /oauth/login:
    post:
      tags: [OAuth2]
      summary: Menyerahkan kredensial, menghasilkan kode otorisasi sekali pakai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_request, email, password]
              additionalProperties: false
              properties:
                auth_request: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        '422': { description: Validasi gagal (body/query tidak sesuai), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: 'Berisi code, state, dan redirect_to' }
        '401': { $ref: '#/components/responses/Error' }
        '423': { description: Akun terkunci sementara setelah 5 kali gagal }
        '429': { $ref: '#/components/responses/RateLimited' }
  /oauth/token:
    post:
      tags: [OAuth2]
      summary: Token endpoint
      description: 'Grant: authorization_code (wajib code_verifier), refresh_token (berotasi, deteksi pemakaian ulang), client_credentials.'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token, client_credentials] }
                client_id: { type: string }
                client_secret: { type: string }
                code: { type: string }
                code_verifier: { type: string }
                redirect_uri: { type: string }
                refresh_token: { type: string }
                scope: { type: string }
      responses:
        '422': { description: Validasi gagal (body/query tidak sesuai), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Token, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /oauth/revoke:
    post:
      tags: [OAuth2]
      summary: Mencabut refresh token (RFC 7009)
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, properties: { client_id: { type: string }, token: { type: string } } }
      responses:
        '422': { description: Validasi gagal (body/query tidak sesuai), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Selalu 200, tidak membocorkan keberadaan token }
  /oauth/userinfo:
    get:
      tags: [OAuth2]
      summary: Profil dari access token
      security: [{ bearer: [] }, { bearerToken: [] }]
      responses:
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Profil }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/me:
    get:
      tags: [Profil]
      summary: Profil pengguna saat ini
      security: [{ bearer: [] }, { bearerToken: [] }]
      responses:
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Profil }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Profil]
      summary: Mengubah profil sendiri (sebagian)
      description: Field yang tidak dikirim tetap memakai nilai lama. Kirim string kosong atau null untuk mengosongkan. Data profil dipakai untuk mengisi otomatis penumpang pertama.
      security: [{ bearer: [] }, { bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                phone: { type: string, nullable: true, example: '081234567890' }
                nik: { type: string, nullable: true, description: 16 digit angka }
                birthDate: { type: string, format: date, nullable: true }
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Profil terbaru }
        '422': { $ref: '#/components/responses/Error' }
  /api/auth/me/password:
    post:
      tags: [Profil]
      summary: Mengganti kata sandi sendiri
      description: Sesi di perangkat lain dikeluarkan setelah berhasil.
      security: [{ bearer: [] }, { bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { type: string, minLength: 8, maxLength: 72 } } }
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Diganti }
        '422': { description: Sandi lama salah atau sandi baru lemah, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/stations:
    get:
      tags: [Jadwal]
      summary: Daftar stasiun
      responses:
        '200': { description: Daftar stasiun }
  /api/schedules:
    get:
      tags: [Jadwal]
      summary: Mencari perjalanan
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, example: GMR } }
        - { name: to, in: query, required: true, schema: { type: string, example: MN } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: train, in: query, required: false, description: Kode kereta, misalnya GJY, untuk memfilter nama kereta, schema: { type: string, example: GJY } }
      responses:
        '200': { description: Daftar perjalanan beserta tarif dan kursi kosong pada ruas itu. Kereta nonaktif dan perjalanan yang sudah berangkat tidak tampil. }
        '422': { $ref: '#/components/responses/Error' }
  /api/trips:
    post:
      tags: [Masinis]
      summary: Membuat perjalanan tambahan (admin)
      security: [{ bearer: [schedule:write] }, { bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trainId, serviceDate, departureTime]
              properties:
                trainId: { type: string, example: GJY }
                direction: { type: string, enum: [A, B], default: A }
                serviceDate: { type: string, format: date }
                departureTime: { type: string, example: '09:30' }
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '201': { description: Dibuat }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/trips/{id}:
    parameters: [{ $ref: '#/components/parameters/TripId' }]
    get:
      tags: [Jadwal]
      summary: Detail perjalanan
      responses:
        '200': { description: Detail, termasuk daftar segmen }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Masinis]
      summary: Mengubah status perjalanan
      description: CANCELLED menerbitkan event `trip.cancelled`, semua pesanan batal dan dana kembali penuh.
      security: [{ bearer: [schedule:write] }, { bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [SCHEDULED, DELAYED, CANCELLED] }
                delayMinutes: { type: integer }
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Validasi gagal (body/query tidak sesuai), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Diubah }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/trips/{id}/seats:
    parameters: [{ $ref: '#/components/parameters/TripId' }]
    get:
      tags: [Kursi]
      summary: Peta kursi per ruas (setara query GraphQL seatMap)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Peta kursi }
        '422': { $ref: '#/components/responses/Error' }
  /api/trips/{id}/availability:
    parameters: [{ $ref: '#/components/parameters/TripId' }]
    get:
      tags: [Kursi]
      summary: Kursi yang terpakai pada satu ruas
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        '422': { description: Validasi gagal (body/query tidak sesuai), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Daftar kursi LOCKED dan BOOKED }
  /api/trips/{id}/seats/stream:
    parameters: [{ $ref: '#/components/parameters/TripId' }]
    get:
      tags: [Kursi]
      summary: Perubahan kursi real-time (Server-Sent Events)
      description: Event `seat` berisi `seats`, `fromIndex`, `toIndex`, dan `status`. Berlaku lintas instance booking-service.
      responses:
        '200': { description: Aliran text/event-stream }
  /api/trips/{id}/manifest:
    parameters: [{ $ref: '#/components/parameters/TripId' }]
    get:
      tags: [Masinis]
      summary: Daftar penumpang (NIK dimasker)
      security: [{ bearer: [manifest:read] }, { bearerToken: [] }]
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Manifest }
        '403': { $ref: '#/components/responses/Error' }
  /api/locks:
    post:
      tags: [Kursi]
      summary: Menahan kursi pada ruas tertentu
      description: |
        Klaim per segmen bersifat atomik: semua kursi dan semua segmen berhasil, atau tidak sama sekali.
        Dua lock pada kursi yang sama hanya berkonflik bila ruasnya tumpang tindih. Kursi dilepas otomatis setelah TTL.
      security: [{ bearer: [booking:write] }, { bearerToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LockRequest' }
      responses:
        '201': { description: Kursi ditahan, content: { application/json: { schema: { $ref: '#/components/schemas/Lock' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'SEAT_CONFLICT, TOO_MANY_ACTIVE_LOCKS, TRIP_CANCELLED, TRIP_DEPARTED, atau IDEMPOTENCY_KEY_REUSED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/locks/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Kursi]
      summary: Status penahanan milik sendiri
      security: [{ bearer: [booking:read] }, { bearerToken: [] }]
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Lock, content: { application/json: { schema: { $ref: '#/components/schemas/Lock' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Kursi]
      summary: Mengubah kursi dalam penahanan (dipakai saat pengguna memilih atau melepas satu kursi)
      description: |
        Aplikasi web mengunci kursi begitu dipilih: kursi pertama memakai `POST /api/locks`, kursi berikutnya mengganti isi lock lewat endpoint ini.
        Kursi baru diklaim secara atomik (gagal seluruhnya dengan 409 bila ada yang sudah ditahan/terisi), kursi yang tidak lagi dipilih dilepas.
        TTL tidak diperpanjang. Perubahan didorong ke semua penonton peta kursi lewat SSE.
      security: [{ bearer: [booking:write] }, { bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              additionalProperties: false
              properties: { seats: { type: array, minItems: 1, uniqueItems: true, items: { type: string, example: EKS1-5A } } }
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Lock setelah diubah, content: { application/json: { schema: { $ref: '#/components/schemas/Lock' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Kursi]
      summary: Melepas kursi
      security: [{ bearer: [booking:write] }, { bearerToken: [] }]
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Dilepas }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/bookings:
    get:
      tags: [Pesanan]
      summary: Pesanan milik sendiri
      security: [{ bearer: [booking:read] }, { bearerToken: [] }]
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Daftar pesanan }
    post:
      tags: [Pesanan]
      summary: Membuat pesanan dari lock aktif
      description: Harga dihitung di server menurut kelas, jarak ruas, dan usia. NIK wajib untuk usia 17 ke atas.
      security: [{ bearer: [booking:write] }, { bearerToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRequest' }
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '201': { description: Pesanan menunggu bayar, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { description: 'INVALID_NIK, NIK_REQUIRED, INVALID_AGE, PASSENGER_SEAT_MISMATCH, DUPLICATE_PASSENGER', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/bookings/instance:
    get:
      tags: [Pesanan]
      summary: Nama instance yang melayani (demo load balancing)
      responses:
        '200': { description: Nama instance }
  /api/bookings/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Pesanan]
      summary: Detail pesanan milik sendiri
      description: Pesanan milik orang lain dijawab 404 agar keberadaannya tidak bocor.
      security: [{ bearer: [booking:read] }, { bearerToken: [] }]
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Pesanan, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/bookings/{id}/refund-preview:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Pesanan]
      summary: Perkiraan pengembalian dana sebelum membatalkan
      security: [{ bearer: [booking:read] }, { bearerToken: [] }]
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: 'Persentase: >=72 jam 90%, >=24 jam 75%, >=3 jam 50%, <3 jam 0%' }
        '404': { $ref: '#/components/responses/Error' }
  /api/bookings/{id}/cancel:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Pesanan]
      summary: Membatalkan pesanan dan melepas kursi
      security: [{ bearer: [booking:write] }, { bearerToken: [] }]
      responses:
