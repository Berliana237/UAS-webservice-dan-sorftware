      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Disimpan }
        '422': { $ref: '#/components/responses/Error' }
  /api/admin/catalog-stats:
    get:
      tags: [Admin]
      summary: Ringkasan katalog untuk dashboard
      security: [{ bearer: ['system:read'] }, { bearerToken: [] }]
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Statistik }
  /api/admin/trips/{id}/passengers:
    get:
      tags: [Admin]
      summary: Daftar penumpang satu perjalanan beserta email pemesan
      security: [{ bearer: ['system:read'] }, { bearerToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TripId' }]
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Penumpang }
  /api/admin/trip-stats:
    post:
      tags: [Admin]
      summary: Jumlah penumpang untuk banyak perjalanan sekaligus
      security: [{ bearer: ['system:read'] }, { bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [tripIds], properties: { tripIds: { type: array, maxItems: 200, items: { type: string } } } }
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Validasi gagal (body/query tidak sesuai), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Statistik per perjalanan }
  /api/admin/transfers:
    get:
      tags: [Admin]
      summary: Bukti transfer VA untuk diverifikasi
      security: [{ bearer: ['payment:review'] }, { bearerToken: [] }]
      parameters: [{ name: status, in: query, schema: { type: string, enum: [SUBMITTED, ACCEPTED, REJECTED] }, description: Tanpa nilai berarti semua }]
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: 'transfers[]: proof, payment, user (email, nama, NIK), booking (kereta, keberangkatan)' }
  /api/admin/transfers/{proofId}/decision:
    post:
      tags: [Admin]
      summary: Menerima atau menolak bukti transfer
      description: Keputusan bisa diubah kemudian. REJECT mengirim notifikasi berisi alasan ke pengguna. Mengubah ACCEPT menjadi REJECT membatalkan pesanan.
      security: [{ bearer: ['payment:review'] }, { bearerToken: [] }]
      parameters: [{ name: proofId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [ACCEPT, REJECT] }, reason: { type: string, minLength: 5, maxLength: 300, description: Wajib untuk REJECT } } }
      responses:
        '401': { description: Token tidak ada, kedaluwarsa, atau tidak valid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Scope atau peran tidak mencukupi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '200': { description: Keputusan disimpan }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: PAYMENT_CLOSED }
        '422': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Tempel access token (JWT) yang sudah didapat, misalnya dari Postman atau dari alur `/oauth/authorize` -> `/oauth/login` -> `/oauth/token`.
    bearer:
      type: oauth2
      description: JWT RS256 dari Authorization Code + PKCE, atau Client Credentials.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            customer: Pelanggan
            masinis: Masinis
            admin: Admin
            schedule:write: Mengubah jadwal
            booking:read: Membaca pesanan sendiri
            booking:write: Menahan kursi dan memesan
            payment:write: Membuat pembayaran
            manifest:read: Membaca manifest
            checkin:write: Check-in tiket
            system:read: Melihat kesehatan sistem
            audit:read: Membaca audit
            schedule:read: Membaca jadwal
            payment:review: Memverifikasi bukti transfer
            user:manage: Mengelola pengguna
            apikey:manage: Mengelola API key
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            partner:read: Akses partner
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    TripId:
      name: id
      in: path
      required: true
      schema: { type: string, example: GJY-20261120-A0740 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Kiriman ulang dengan kunci dan isi yang sama mengembalikan hasil pertama. Kunci sama dengan isi berbeda menghasilkan 409.
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Error:
      description: Kesalahan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Terlalu banyak permintaan
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: SEAT_CONFLICT }
            message: { type: string }
            details: { type: object }
        requestId: { type: string }
    RegisterRequest:
      type: object
      required: [name, email, password]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72, description: Kombinasi huruf dan angka }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
        refresh_token: { type: string }
        scope: { type: string }
    LockRequest:
      type: object
      required: [tripId, from, to, seats]
      additionalProperties: false
      properties:
        tripId: { type: string, example: GJY-20261120-A0740 }
        from: { type: string, example: GMR }
        to: { type: string, example: MN }
        seats:
          type: array
          minItems: 1
          maxItems: 648
          uniqueItems: true
          items: { type: string, pattern: '^[A-Z0-9]{2,6}-[0-9]{1,2}[A-D]$', example: EKS1-7A }
        ttlSeconds: { type: integer, minimum: 3, maximum: 3600, description: Hanya bisa memperpendek batas server (600 detik). }
      description: Jumlah kursi per pesanan tidak dibatasi. maxItems 648 hanya batas teknis (kapasitas rangkaian terbesar, 9 gerbong x 72 kursi).
    Lock:
      type: object
      properties:
        id: { type: string }
        tripId: { type: string }
        seats: { type: array, items: { type: string } }
        fromIndex: { type: integer }
        toIndex: { type: integer }
        status: { type: string, enum: [ACTIVE, RELEASED, EXPIRED, CONVERTED] }
        expiresAt: { type: integer, format: int64 }
        serverTime: { type: integer, format: int64 }
    BookingRequest:
      type: object
      required: [lockId, passengers]
      additionalProperties: false
      properties:
        lockId: { type: string }
        passengers:
          type: array
          minItems: 1
          maxItems: 648
          items:
            type: object
            required: [seatId, name, age]
            additionalProperties: false
            properties:
              seatId: { type: string }
              name: { type: string, minLength: 2, maxLength: 80 }
              age: { type: integer, minimum: 0, maximum: 120 }
              nik: { type: string, maxLength: 16, description: Wajib untuk usia 17 ke atas. }
              phone: { type: string, maxLength: 20 }
    Booking:
      type: object
      properties:
        id: { type: string }
        code: { type: string, example: W3X6VL }
        status: { type: string, enum: [PENDING_PAYMENT, CONFIRMED, CHECKED_IN, CANCELLED, EXPIRED] }
        tripId: { type: string }
        trainName: { type: string }
        from: { type: object, properties: { code: { type: string }, name: { type: string } } }
        to: { type: object, properties: { code: { type: string }, name: { type: string } } }
        departureAt: { type: integer, format: int64 }
        amount: { type: integer }
        expiresAt: { type: integer, format: int64 }
        refundAmount: { type: integer }
        passengers:
          type: array
          items:
            type: object
            properties:
              seatId: { type: string }
              seatClass: { type: string }
              name: { type: string }
              age: { type: integer }
              passengerType: { type: string, enum: [INFANT, CHILD, ADULT, SENIOR], description: 'Bayi 0-3, anak 4-16, dewasa 17-59 bertarif normal. Lansia 60+ mendapat diskon.' }
              passengerTypeLabel: { type: string, example: Lansia }
              fare: { type: integer }
              nikMasked: { type: string, nullable: true, example: '************0001' }
              ticketCode: { type: string, nullable: true }
              checkedIn: { type: boolean }
